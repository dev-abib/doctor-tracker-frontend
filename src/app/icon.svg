<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4338CA" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="8" fill="url(#brand-grad)" />

  <!-- ECG Medical Pulse Waveform -->
  <path
    d="M 5 16.5 L 10 16.5 L 12.5 10.5 L 16 22.5 L 19.5 13 L 22 16.5 L 27 16.5"
    stroke="#FFFFFF"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Small Pulse Dot -->
  <circle cx="27" cy="16.5" r="1.5" fill="#38BDF8" />
</svg>
